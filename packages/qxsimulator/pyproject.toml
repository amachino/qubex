[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "qubex-simulator"
version = "1.5.0rc4"
requires-python = ">=3.10"
authors = [{ name = "Akinori Machino" }]
description = "Qubex quantum system simulation utilities"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "networkx >= 2.7",
    "numpy >= 1.22",
    "plotly >= 5.23",
    "qctrl-visualizer >= 8.0",
    "qutip[runtime-compilation] >= 5.0.1",
    "qubex-core == 1.5.0rc4",
    "qubex-pulse == 1.5.0rc4",
    "qubex-visualizer == 1.5.0rc4",
    "scipy >= 1.0",
    "typing_extensions >= 4.5",
]

[tool.setuptools.package-data]
qxsimulator = ["py.typed"]
